name: Release build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version number for a test build"
        required: true
        default: "9999.0.0"

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Store GitHub release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $versionIn = '${{ github.ref }}'
          $version = $versionIn -replace '^refs/tags/v', ''
          if ($versionIn -eq $version) { exit 1 }
          echo "version=$version" >> $env:GITHUB_ENV

      - name: Store manual workflow version
        if: startsWith(github.ref, 'refs/tags/') == false
        run: |
          echo "version=${{ github.event.inputs.version }}" >> $env:GITHUB_ENV

      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Write the release version
        run: |
          @{ version = $env:version } | ConvertTo-Json | Set-Content -Encoding utf8 release-version.json

      - name: Skip the local Community copy
        run: |
          $cfg = Get-Content -Raw build-config.json | ConvertFrom-Json
          $cfg.communityDir = ''
          $cfg.fs2020CommunityDir = ''
          $cfg | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 build-config.json

      - name: Install and release
        run: |
          npm ci
          npm run release

      - name: Archive the zip
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/') == false
        with:
          name: release_files
          path: dist/*.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.zip
          draft: true
          name: "Release ${{ env.version }}"
          generate_release_notes: true
