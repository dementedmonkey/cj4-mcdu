<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>C750 Web CDU</title>
  <meta http-equiv="Cache-Control" content="no-store" />
  <link rel="stylesheet" href="cdu-c750.css?v=20261014-127" />
</head>
<body data-face="c750" class="face-c750">
  <div class="app">
    <div class="unit" id="unit">
      <span class="fastener fastener-tl" aria-hidden="true"></span>
      <span class="fastener fastener-tr" aria-hidden="true"></span>
      <span class="fastener fastener-bl" aria-hidden="true"></span>
      <span class="fastener fastener-br" aria-hidden="true"></span>
      <div class="hw-raise hw-raise-top" aria-hidden="true"></div>
      <div class="hw-raise hw-raise-right" aria-hidden="true"></div>
      <div class="hw-raise hw-raise-low" aria-hidden="true"></div>

      <div class="hw-vents" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="wordmark">Honeywell</div>

      <header class="eyebrow">
        <div class="plate">C750</div>
        <div class="side-wrap">
          <span id="status" class="status disconnected">NO LINK</span>
          <div class="side" role="group" aria-label="CDU side">
            <button type="button" id="side-capt" data-side="1" class="on">CPT</button>
            <button type="button" id="side-fo" data-side="2">FO</button>
            <button type="button" id="side-both" data-side="both">BOTH</button>
          </div>
        </div>
      </header>

      <div class="hw-well" aria-hidden="true"></div>
      <div class="hw-notches" aria-hidden="true">
        <span class="left"></span><span class="left"></span><span class="left"></span><span class="left"></span>
        <span class="right"></span><span class="right"></span><span class="right"></span><span class="right"></span>
      </div>
      <div class="hw-glass">
        <div id="screen" class="screen" aria-label="CDU screen"></div>
      </div>

      <div class="hw-lsks left" aria-label="Left line select keys">
        <button type="button" data-key="L1" aria-label="LSK 1L"></button>
        <button type="button" data-key="L2" aria-label="LSK 2L"></button>
        <button type="button" data-key="L3" aria-label="LSK 3L"></button>
        <button type="button" data-key="L4" aria-label="LSK 4L"></button>
        <span class="hw-ridge" aria-hidden="true"></span>
        <span class="hw-ridge" aria-hidden="true"></span>
        <span class="hw-ridge" aria-hidden="true"></span>
        <span class="hw-ridge" aria-hidden="true"></span>
      </div>
      <div class="hw-lsks right" aria-label="Right line select keys">
        <button type="button" data-key="R1" aria-label="LSK 1R"></button>
        <button type="button" data-key="R2" aria-label="LSK 2R"></button>
        <button type="button" data-key="R3" aria-label="LSK 3R"></button>
        <button type="button" data-key="R4" aria-label="LSK 4R"></button>
        <span class="hw-ridge" aria-hidden="true"></span>
        <span class="hw-ridge" aria-hidden="true"></span>
        <span class="hw-ridge" aria-hidden="true"></span>
        <span class="hw-ridge" aria-hidden="true"></span>
      </div>

      <div class="hw-modes" aria-label="Mode keys">
        <button type="button" data-key="PERF">PERF</button>
        <button type="button" data-key="IDX">NAV</button>
        <div class="hw-pair">
          <button type="button" data-key="PREVPAGE">PREV</button>
          <button type="button" data-key="NEXTPAGE">NEXT</button>
        </div>
        <button type="button" data-key="FPLN">FPL</button>
        <button type="button" data-key="MSG">PROG</button>
        <button type="button" data-key="DIR">DIR</button>
        <div class="hw-knob">
          <button type="button" data-key="BRT" aria-label="Brighter"></button>
          <button type="button" data-key="DIM" aria-label="Dimmer"></button>
          <span class="hw-knob-cap" aria-hidden="true"></span>
          <span class="hw-knob-slot" aria-hidden="true"></span>
          <span class="hw-knob-name">BRT</span>
        </div>
      </div>

      <div class="hw-board">
        <div class="hw-alpha" aria-label="Letter keys">
          <button type="button" data-key="A">A</button>
          <button type="button" data-key="B">B</button>
          <button type="button" data-key="C">C</button>
          <button type="button" data-key="D">D</button>
          <button type="button" data-key="E"><span>E</span></button>
          <button type="button" data-key="F">F</button>
          <button type="button" data-key="G">G</button>
          <button type="button" data-key="H">H</button>
          <button type="button" data-key="I">I</button>
          <button type="button" data-key="J">J</button>
          <button type="button" data-key="K">K</button>
          <button type="button" data-key="L">L</button>
          <button type="button" data-key="M">M</button>
          <button type="button" data-key="N"><span>N</span></button>
          <button type="button" data-key="O">O</button>
          <button type="button" data-key="P">P</button>
          <button type="button" data-key="Q">Q</button>
          <button type="button" data-key="R">R</button>
          <button type="button" data-key="S"><span>S</span></button>
          <button type="button" data-key="T">T</button>
          <button type="button" data-key="U">U</button>
          <button type="button" data-key="V">V</button>
          <button type="button" data-key="W"><span>W</span></button>
          <button type="button" data-key="X">X</button>
          <button type="button" data-key="Y">Y</button>
          <button type="button" data-key="Z">Z</button>
          <button type="button" data-key="DEL">DEL</button>
          <button type="button" data-key="CLR">CLR</button>
        </div>
        <div class="hw-num" aria-label="Number keys">
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>
          <button type="button" data-key="DOT" aria-label="Decimal"><span>.</span></button>
          <button type="button" data-key="0">0</button>
          <button type="button" data-key="PLUSMINUS" aria-label="Plus minus">−</button>
          <button type="button" data-key="DIV" aria-label="Slash">/</button>
        </div>
      </div>
    </div>
  </div>
  <script>window.LIM_WS_PORT = __LIM_WS_PORT__;</script>
  <script src="lim-route.js?v=20261015-3"></script>
  <script src="cdu-wt21.js?v=20261015-1"></script>
</body>
</html>
