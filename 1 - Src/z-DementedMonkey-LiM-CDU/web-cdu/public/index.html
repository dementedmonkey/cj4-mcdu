<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>html { visibility: hidden; }</style>
  <script>
    (function () {
      var face = '';
      try { face = new URLSearchParams(location.search).get('face') || ''; } catch (e) {}
      if (face === 'p180') {
        location.replace('p180.html' + (location.search || ''));
        return;
      }
      if (face === 'hawker') {
        location.replace('hawker.html' + (location.search || ''));
        return;
      }
      if (face === 'c750') {
        location.replace('c750.html' + (location.search || ''));
        return;
      }
      location.replace('wt21.html' + (location.search || ''));
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
