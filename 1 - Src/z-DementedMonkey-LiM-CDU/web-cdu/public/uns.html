<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UNS-1 Web CDU</title>
  <meta http-equiv="Cache-Control" content="no-store" />
  <link rel="stylesheet" href="cdu-uns.css?v=20261011-48" />
</head>
<body>
  <div class="app">
    <div class="uns-side" id="uns-side" hidden>
      <button type="button" id="side-capt" data-side="1">CPT</button>
      <button type="button" id="side-fo" data-side="2">FO</button>
      <button type="button" id="side-both" data-side="both">BOTH</button>
    </div>
    <div class="unit" data-face="4in">
      <button type="button" id="face-toggle" class="dzus dzus-tl" title="Switch 4-inch / 5-inch bezel" aria-label="Switch 4-inch / 5-inch bezel">
        <span class="dzus-cam" aria-hidden="true"></span>
      </button>
      <span class="dzus dzus-tr" aria-hidden="true"><span class="dzus-cam"></span></span>
      <span class="dzus dzus-bl" aria-hidden="true"><span class="dzus-cam"></span></span>
      <span class="dzus dzus-br" aria-hidden="true"><span class="dzus-cam"></span></span>
      <div class="badge">UNIVERSAL</div>
      <span id="status" class="status disconnected">Waiting</span>

      <div class="modes left">
        <button type="button" class="mode" data-key="MSG">MSG</button>
        <button type="button" class="mode" data-key="DATA">DATA</button>
        <button type="button" class="mode" data-key="FUEL">FUEL</button>
        <button type="button" class="mode" data-key="TUNE">TUNE</button>
        <button type="button" class="mode" data-key="PREVPAGE">PREV</button>
        <button type="button" class="mode" data-key="NEXTPAGE">NEXT</button>
        <button type="button" class="mode" data-key="PWR_DIM">PWR<br>DIM</button>
      </div>

      <div class="center">
        <div class="face">
          <div class="lsks left">
            <span class="lsk-slot"></span>
            <span class="lsk-slot"></span>
            <button type="button" class="lsk" data-key="L1" aria-label="LSK 1L">—</button>
            <span class="lsk-slot"></span>
            <button type="button" class="lsk" data-key="L2" aria-label="LSK 2L">—</button>
            <span class="lsk-slot"></span>
            <button type="button" class="lsk" data-key="L3" aria-label="LSK 3L">—</button>
            <span class="lsk-slot"></span>
            <button type="button" class="lsk" data-key="L4" aria-label="LSK 4L">—</button>
            <span class="lsk-slot"></span>
            <button type="button" class="lsk" data-key="L5" aria-label="LSK 5L">—</button>
          </div>

          <div class="screen-bezel">
            <div class="screen-slope left" aria-hidden="true"></div>
            <div id="screen" class="screen" aria-label="CDU screen"></div>
            <div class="screen-slope right" aria-hidden="true"></div>
          </div>

          <div class="lsks right">
            <span class="lsk-slot"></span>
            <span class="lsk-slot"></span>
            <button type="button" class="lsk" data-key="R1" aria-label="LSK 1R">—</button>
            <span class="lsk-slot"></span>
            <button type="button" class="lsk" data-key="R2" aria-label="LSK 2R">—</button>
            <span class="lsk-slot"></span>
            <button type="button" class="lsk" data-key="R3" aria-label="LSK 3R">—</button>
            <span class="lsk-slot"></span>
            <button type="button" class="lsk" data-key="R4" aria-label="LSK 4R">—</button>
            <span class="lsk-slot"></span>
            <button type="button" class="lsk" data-key="R5" aria-label="LSK 5R">—</button>
          </div>
        </div>

        <div class="kb">
          <div class="kb-row">
            <button type="button" data-key="A">A</button>
            <button type="button" data-key="B">B</button>
            <button type="button" data-key="C">C</button>
            <button type="button" data-key="D">D</button>
            <button type="button" data-key="E">E</button>
            <button type="button" data-key="F">F</button>
            <button type="button" data-key="G">G</button>
            <button type="button" data-key="1">1</button>
            <button type="button" data-key="2">2</button>
            <button type="button" data-key="3">3</button>
          </div>
          <div class="kb-row">
            <button type="button" data-key="H">H</button>
            <button type="button" data-key="I">I</button>
            <button type="button" data-key="J">J</button>
            <button type="button" data-key="K">K</button>
            <button type="button" data-key="L">L</button>
            <button type="button" data-key="M">M</button>
            <button type="button" data-key="N">N</button>
            <button type="button" data-key="4">4</button>
            <button type="button" data-key="5">5</button>
            <button type="button" data-key="6">6</button>
          </div>
          <div class="kb-row">
            <button type="button" data-key="O">O</button>
            <button type="button" data-key="P">P</button>
            <button type="button" data-key="Q">Q</button>
            <button type="button" data-key="R">R</button>
            <button type="button" data-key="S">S</button>
            <button type="button" data-key="T">T</button>
            <button type="button" data-key="U">U</button>
            <button type="button" data-key="7">7</button>
            <button type="button" data-key="8">8</button>
            <button type="button" data-key="9">9</button>
          </div>
          <div class="kb-row last">
            <button type="button" data-key="V">V</button>
            <button type="button" data-key="W">W</button>
            <button type="button" data-key="X">X</button>
            <button type="button" data-key="Y">Y</button>
            <button type="button" data-key="Z">Z</button>
            <button type="button" class="wide" data-key="ENTER">ENTER</button>
            <button type="button" class="back" data-key="BACK">BACK</button>
            <button type="button" data-key="0">0</button>
            <button type="button" data-key="PLUSMINUS">±</button>
          </div>
        </div>

        <div class="pad5" aria-hidden="true">
          <div class="pad5-left">
            <div class="pad5-island pad5-island-wide">
              <div class="kb-row menu6">
                <button type="button" class="mode" data-key="DATA">DATA</button>
                <button type="button" class="mode" data-key="NAV">NAV</button>
                <button type="button" class="mode" data-key="VNAV">VNAV</button>
                <button type="button" class="mode" data-key="DTO">DTO</button>
                <button type="button" class="mode" data-key="LIST">LIST</button>
                <button type="button" class="mode" data-key="PREVPAGE">PREV</button>
              </div>
              <div class="kb-row menu6">
                <button type="button" class="mode" data-key="FUEL">FUEL</button>
                <button type="button" class="mode" data-key="FPL">FPL</button>
                <button type="button" class="mode" data-key="PERF">PERF</button>
                <button type="button" class="mode" data-key="TUNE">TUNE</button>
                <button type="button" class="mode" data-key="MENU">MENU</button>
                <button type="button" class="mode" data-key="NEXTPAGE">NEXT</button>
              </div>
              <div class="kb-row">
                <button type="button" data-key="A">A</button>
                <button type="button" data-key="B">B</button>
                <button type="button" data-key="C">C</button>
                <button type="button" data-key="D">D</button>
                <button type="button" data-key="E">E</button>
                <button type="button" data-key="F">F</button>
                <button type="button" data-key="G">G</button>
              </div>
              <div class="kb-row">
                <button type="button" data-key="H">H</button>
                <button type="button" data-key="I">I</button>
                <button type="button" data-key="J">J</button>
                <button type="button" data-key="K">K</button>
                <button type="button" data-key="L">L</button>
                <button type="button" data-key="M">M</button>
                <button type="button" data-key="N">N</button>
              </div>
            </div>
            <div class="pad5-island pad5-island-narrow">
              <div class="kb-row">
                <button type="button" data-key="O">O</button>
                <button type="button" data-key="P">P</button>
                <button type="button" data-key="Q">Q</button>
                <button type="button" data-key="R">R</button>
                <button type="button" data-key="S">S</button>
                <button type="button" data-key="T">T</button>
              </div>
              <div class="kb-row">
                <button type="button" data-key="U">U</button>
                <button type="button" data-key="V">V</button>
                <button type="button" data-key="W">W</button>
                <button type="button" data-key="X">X</button>
                <button type="button" data-key="Y">Y</button>
                <button type="button" data-key="Z">Z</button>
              </div>
            </div>
          </div>
          <div class="pad5-split" aria-hidden="true"></div>
          <div class="pad5-right">
            <div class="pad5-island pad5-island-wide">
              <div class="kb-row three">
                <button type="button" data-key="1">1</button>
                <button type="button" data-key="2">2</button>
                <button type="button" data-key="3">3</button>
              </div>
              <div class="kb-row three">
                <button type="button" data-key="4">4</button>
                <button type="button" data-key="5">5</button>
                <button type="button" data-key="6">6</button>
              </div>
              <div class="kb-row three">
                <button type="button" data-key="7">7</button>
                <button type="button" data-key="8">8</button>
                <button type="button" data-key="9">9</button>
              </div>
              <div class="kb-row three">
                <button type="button" class="back" data-key="BACK">BACK</button>
                <button type="button" data-key="0">0</button>
                <button type="button" data-key="MSG">MSG</button>
              </div>
            </div>
            <div class="pad5-island pad5-island-narrow">
              <div class="kb-row two">
                <button type="button" class="dim" data-key="PWR_DIM">DIM</button>
                <button type="button" data-key="PLUSMINUS">±</button>
              </div>
              <div class="kb-row enter-row">
                <button type="button" class="enter" data-key="ENTER">ENTER</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="modes right">
        <button type="button" class="mode" data-key="NAV">NAV</button>
        <button type="button" class="mode" data-key="DTO">DTO</button>
        <button type="button" class="mode" data-key="FPL">FPL</button>
        <button type="button" class="mode" data-key="VNAV">VNAV</button>
        <button type="button" class="mode" data-key="LIST">LIST</button>
        <button type="button" class="mode" data-key="MENU">MENU</button>
        <button type="button" class="mode" data-key="PERF">PERF</button>
      </div>
    </div>
  </div>
  <script>window.LIM_WS_PORT = __LIM_WS_PORT__; window.UNS1_WS_PORT = window.LIM_WS_PORT;</script>
  <script src="cdu-uns.js?v=20261010-5"></script>
</body>
</html>
